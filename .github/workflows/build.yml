name: Build FPS Mode Forge

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Generate and commit Gradle Wrapper if missing
        shell: bash
        run: |
          if [ ! -f gradlew ] || [ ! -f gradlew.bat ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            gradle wrapper --gradle-version 8.8 --no-daemon
            if [ -n "$(git status --porcelain -- gradlew gradlew.bat gradle/wrapper)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
              git commit -m "Add Gradle wrapper"
              git push
            fi
          fi
      - name: Build Forge mod
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Mode-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 90
